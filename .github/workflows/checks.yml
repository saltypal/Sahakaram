name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sahakaram
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sahakaram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sahakaram -d sahakaram_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SAHAKARAM_TEST_DATABASE_URL: postgresql+psycopg://sahakaram:test-only-password@127.0.0.1:5432/sahakaram_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.4"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra codex --no-install-package openai-codex-cli-bin
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
      - run: uv build
